<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VN Vault — Visual Novel Bookmarks</title><style>
:root{
  --bg:#0b0b12; --panel:#13131d; --panel2:#191925; --text:#f4f3f8;
  --muted:#9895a8; --accent:#a855f7; --accent2:#ec4899; --border:#272637;
  --green:#34d399; --yellow:#fbbf24; --blue:#60a5fa;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 20% 0%,#12121c 0,#0b0b12 35%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:1400px;margin:auto;padding:28px}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}
.brand{display:flex;align-items:center;gap:13px}
.logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:23px;box-shadow:0 8px 30px #a855f733}
h1{font-size:25px;margin:0}.subtitle{color:var(--muted);font-size:13px;margin-top:3px}
.actions{display:flex;gap:10px}
.btn{border:1px solid var(--border);background:var(--panel);color:var(--text);padding:10px 15px;border-radius:11px}
.btn.primary{border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));font-weight:700}
.toolbar{background:#11111aee;border:1px solid var(--border);padding:14px;border-radius:16px;display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;position:sticky;top:10px;z-index:5;backdrop-filter:blur(14px)}
.search{flex:1;min-width:220px}
input,select,textarea{background:#0d0d15;border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:22px}
.tab{padding:8px 13px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--muted)}
.tab.active{background:#8b5cf622;color:#ddd;border-color:#8b5cf666}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px}
.card{background:linear-gradient(180deg,#171722,#101018);border:1px solid var(--border);border-radius:15px;overflow:hidden;transition:.2s;position:relative}
.card:hover{transform:translateY(-5px);border-color:#8b5cf677;box-shadow:0 15px 35px #0008}
.cover{aspect-ratio:3/4;position:relative;overflow:hidden;background:#242333}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .placeholder{height:100%;display:grid;place-items:center;color:#77728a;font-size:42px;background:linear-gradient(135deg,#211c35,#151520)}
.status{position:absolute;top:10px;left:10px;padding:5px 8px;border-radius:7px;background:#080810d9;font-size:11px;font-weight:700;backdrop-filter:blur(8px)}
.cardbody{padding:12px}.title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:var(--muted);margin-top:5px}.rating{color:#fbbf24;margin-top:8px;font-size:13px}
.card-actions{display:flex;gap:7px;margin-top:11px}.small{flex:1;padding:7px;border-radius:8px;border:1px solid var(--border);background:#0d0d15;color:var(--text);font-size:12px}
.empty{text-align:center;padding:70px 20px;color:var(--muted);grid-column:1/-1}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal.show{display:flex}.modalbox{width:min(620px,100%);max-height:90vh;overflow:auto;background:#15151f;border:1px solid var(--border);border-radius:18px;padding:22px;box-shadow:0 25px 80px #000}
.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal h2{margin:0}.close{background:none;border:0;color:var(--muted);font-size:24px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
textarea{min-height:100px;resize:vertical;width:100%}.field input,.field select{width:100%}
.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
.count{color:var(--muted);font-size:13px;margin:0 0 12px}
@media(max-width:1100px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:800px){.grid{grid-template-columns:repeat(3,1fr)}header{align-items:flex-start;flex-direction:column}}
@media(max-width:560px){.app{padding:16px}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.toolbar{position:static}.actions{width:100%}.actions .btn{flex:1}}

$('importBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let text=await f.text(),doc=new DOMParser().parseFromString(text,'application/xml');if(doc.querySelector('parsererror'))throw Error('Invalid XML');let labels={};doc.querySelectorAll('labels > label').forEach(x=>labels[x.getAttribute('id')]=x.getAttribute('label'));let arr=[...doc.querySelectorAll('vns > vn')].map(x=>{let t=x.querySelector('title');let ls=[...x.querySelectorAll(':scope > label')].map(z=>z.getAttribute('label'));let s=['Playing','Finished','Stalled','Dropped','Wishlist','Blacklist'].find(z=>ls.includes(z))||'Wishlist';let vote=x.querySelector('vote');return {id:x.getAttribute('id'),name:t?.textContent||'Unknown',original:t?.getAttribute('original')||'',status:s,rating:vote?Number(vote.textContent)/10:null,added:x.querySelector('added')?.textContent||'',modified:x.querySelector('modified')?.textContent||'',link:'https://vndb.org/'+x.getAttribute('id'),cover:'',genre:'',notes:''}});if(confirm(`Import ${arr.length} visual novels? This will replace the current library.`)){vns=arr;save();render();}}catch(err){alert('Could not import XML: '+err.message)}e.target.value='' };
$('coverBtn').onclick=loadCovers;
async function loadCovers(){let ids=vns.filter(v=>v.id?.startsWith('v')).map(v=>v.id);if(!ids.length)return;let filters=['or',...ids.map(id=>['id','=',id])];$('apiStatus').textContent='Loading covers…';try{let r=await fetch('https://api.vndb.org/kana/vn',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filters,fields:'id,image.thumbnail,title',results:100})});if(!r.ok)throw Error('VNDB API returned '+r.status);let j=await r.json();let m=new Map((j.results||[]).map(x=>[x.id,x.image?.thumbnail||'']));vns=vns.map(v=>m.has(v.id)?{...v,cover:m.get(v.id)}:v);save();render();$('apiStatus').textContent=`Loaded ${m.size} covers`;setTimeout(()=>$('apiStatus').textContent='',4000)}catch(e){$('apiStatus').textContent='Could not load covers';alert('VNDB cover loading failed. The site must be opened with internet access, and some browsers may block API requests from local HTML files. You can still import and use the list.')}}
render();
</script></body></html>
